# Auto-linked from Azure Deployment Center. Express app lives in webapp/ (no package.json at repo root).
# Docs: https://github.com/Azure/webapps-deploy
name: Build and deploy Node.js app to Azure Web App - pa4-25280068

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: npm install, build, and test
        working-directory: webapp
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: webapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0937B0F29FBD45548D287B631FCA5656 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2BF1D360C217459587CA287F7ABDD899 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C33559C081264870A12BB3CC3CF60139 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pa4-25280068'
          slot-name: 'Production'
          # Artifact from path `webapp` extracts to webapp/package.json here
          package: node-app/webapp
